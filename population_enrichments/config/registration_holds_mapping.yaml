# How the registration holds enrichment file writes its values, and where each column goes.
# Written by population_enrichments/registration_holds.py. One student_attribute row per hold:
# key registration_hold, value the hold type. student_attribute has no place for the status or dates.
#
# Each entry: source (or value, a fixed value for every row), destination_table,
# destination_column and on_conflict (append, replace or keep: what the loader does when the
# destination row already holds a value). A source column with no destination is marked
# `dropped:` with the reason. Valid stored values are checked by the rules in
# destination_schema_rules.yaml, which go in config/destination_schema.yaml.

- value: registration_hold
  destination_table: student_attribute
  destination_column: attribute_key
  on_conflict: replace

- source: Student_GUID
  destination_table: student_attribute
  destination_column: student_id
  on_conflict: replace

- source: Academic_Year
  destination_table: term
  destination_column: academic_year
  on_conflict: replace

- source: Academic_Term
  destination_table: term
  destination_column: academic_term
  on_conflict: replace

- source: Hold_Type
  destination_table: student_attribute
  destination_column: attribute_value
  on_conflict: replace

- source: Source
  destination_table: student_attribute
  destination_column: source
  on_conflict: replace

- source: Hold_Status
  dropped: student_attribute holds one value per fact; kept in the CSV for joins outside the model

- source: Placed_Date
  dropped: student_attribute holds one value per fact; kept in the CSV for joins outside the model

- source: Resolved_Date
  dropped: student_attribute holds one value per fact; kept in the CSV for joins outside the model
